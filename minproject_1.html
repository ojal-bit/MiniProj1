<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Project</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
   <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
</head>
<body>
  <div id="main">
    <input type="checkbox" id="check">
    <div class="bttn_one">
      <label for="check">
      <i class="fa-solid fa-bars"></i>
      </label>
    </div>
    
      <div class="menu">
        <div class="logo">
          <a href="#">Ojal Vasule</a>
        </div>
        <div class="bttn_two">
          <label for="check">
            <i class="fa-solid fa-xmark"></i>
          </label>
        </div>
        <div class="nav">
        <ul>
          <li>
            <i class="fa-solid fa-house"></i>
            <a href="#">Home</a>
          </li>
          <li>
            <i class="fa-solid fa-circle-info"></i>
            <a href="#">About</a>
          </li>
          <li>
            <i class="fa-brands fa-servicestack"></i>
            <a href="#">Services</a>
          </li>
          <li>
            <i class="fa-solid fa-phone"></i><a href="#">Contact</a>
          </li>
        </ul>
      </div>
      <div class="social">
        <ul>
          <i class="fa-brands fa-facebook"></i><a href="#"></a>
          <i class="fa-brands fa-instagram"></i><a href="#"></a>
          <i class="fa-brands fa-twitter"></i><a href="#"></a>
        </ul>
      </div>
    </div>
  </div>
</body>
</html>
